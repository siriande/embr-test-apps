name: Trigger auto deployment for py-build-test-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ python ]
    paths:
    - '**'
    - '.github/workflows/py-build-test-app-AutoDeployTrigger-8a87c192-168e-4092-bccb-30462ce2b9b6.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PYBUILDTESTAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PYBUILDTESTAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PYBUILDTESTAPP_AZURE_SUBSCRIPTION_ID }}
          federated-token: true

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.PYBUILDTESTAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PYBUILDTESTAPP_REGISTRY_PASSWORD }}
          containerAppName: py-build-test-app
          resourceGroup: aca-test-rg
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


